name: Discover macOS 26 firmware

on:
  schedule:
    # A backstop only: poll.yml dispatches this within minutes of a new build, while GitHub
    # runs this schedule hours late.
    - cron: "24 * * * *"
  pull_request:
    paths:
      - .github/workflows/discover.yml
      - diffs/**
      - manifests/**
      - track.json
  workflow_dispatch:

permissions: {}

concurrency:
  group: macos-26-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    permissions:
      contents: read
    uses: ipsw-diffs/catalog/.github/workflows/discover.yml@efa33f154b88ff6129de0e942153cd17d5e35cfe
    with:
      policy-path: track.json
      manifests-dir: manifests

  prepare-generation:
    needs: discover
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.discover.outputs.status == 'candidate'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      build: ${{ steps.state.outputs.build }}
      branch: ${{ steps.state.outputs.branch }}
      state: ${{ steps.state.outputs.state }}
    steps:
      - name: Resolve bounded generation state
        id: state
        env:
          DECISION: ${{ needs.discover.outputs.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build="$(jq --exit-status --raw-output '.edges[0].to.build' <<< "$DECISION")"
          [[ "$build" =~ ^[A-Za-z0-9]+$ ]]
          branch="generated/macos-26-$build"
          state=new
          paused="$(gh issue list --repo "$GITHUB_REPOSITORY" --label generation-failed \
            --state open --json number --jq length)"
          if [ "$paused" != 0 ]; then
            state=paused
          elif git ls-remote --exit-code --heads \
            "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/heads/$branch" >/dev/null 2>&1; then
            state=existing
          fi
          {
            printf 'build=%s\n' "$build"
            printf 'branch=%s\n' "$branch"
            printf 'state=%s\n' "$state"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize generation decision
        env:
          BRANCH: ${{ steps.state.outputs.branch }}
          BUILD: ${{ steps.state.outputs.build }}
          STATE: ${{ steps.state.outputs.state }}
        run: |
          {
            echo '### macOS 26 generation decision'
            echo
            echo "- build: $BUILD"
            echo "- branch: $BRANCH"
            echo "- prior state: $STATE"
            case "$STATE" in
              new) echo '- result: start one reusable generation job' ;;
              paused) echo '- result: no-op; close the open generation-failed issue to retry' ;;
              *) echo '- result: no-op; this build already has a generated branch' ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

  generate:
    needs: [discover, prepare-generation]
    if: needs.prepare-generation.outputs.state == 'new'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ipsw-diffs/catalog/.github/workflows/generate.yml@efa33f154b88ff6129de0e942153cd17d5e35cfe
    with:
      policy-path: track.json
      manifests-dir: manifests
      input-kind: ${{ needs.discover.outputs.edge-kind }}
