name: Temporary OTA diff probe

on:
  push:
    branches:
      - probe/ota

permissions: {}

jobs:
  probe:
    name: ${{ matrix.label }}
    runs-on: macos-26
    timeout-minutes: 350
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ota-names
            mode: names
            kind: ota
            os: macOS
            device: Mac17,6
            major: 26
            old_build: 25G332
            new_build: 25G416
            diff_device: ""
            gomemlimit: ""
          - label: ota-gomemlimit
            mode: diff
            kind: ota
            os: macOS
            device: Mac17,6
            major: 26
            old_build: 25G332
            new_build: 25G416
            diff_device: ""
            gomemlimit: 3500MiB
    env:
      KIND: ${{ matrix.kind }}
      APPLEDB_OS: ${{ matrix.os }}
      DEVICE: ${{ matrix.device }}
      MAJOR: ${{ matrix.major }}
      OLD_BUILD: ${{ matrix.old_build }}
      NEW_BUILD: ${{ matrix.new_build }}
      DIFF_DEVICE: ${{ matrix.diff_device }}
      IPSW_TAG: v3.1.744
      SYMBOLICATOR_COMMIT: 81178cfe6c8869612ef092f6471fce3e17d95b20

    steps:
      - name: Record runner and reclaim disk
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/probe"
          {
            sw_vers
            echo "cpus=$(sysctl -n hw.ncpu) memory_bytes=$(sysctl -n hw.memsize)"
            echo "ulimit_soft=$(ulimit -n) ulimit_hard=$(ulimit -Hn)"
            sysctl kern.maxfiles kern.maxfilesperproc
            echo "disk before cleanup:"
            df -h /
          } | tee "$RUNNER_TEMP/probe/runner.txt"
          selected="$(xcode-select -p)"
          selected="${selected%%.app/*}.app"
          for app in /Applications/Xcode*.app; do
            if [ "$app" != "$selected" ] && [ ! -L "$app" ]; then
              sudo rm -rf "$app"
            fi
          done
          sudo rm -rf "$HOME/Library/Android"
          {
            echo "disk after cleanup:"
            df -h /
          } | tee -a "$RUNNER_TEMP/probe/runner.txt"

      - name: Start resource sampler
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/probe/sample.sh" <<'EOF'
          probe="$1"
          low_samples=0
          while true; do
            stamp="$(date -u +%FT%TZ)"
            free_gb="$(df -g / | awk 'NR==2 {print $4}')"
            swap_used="$(sysctl -n vm.swapusage | awk '{print $6}')"
            mem_free_pct="$(sysctl -n kern.memorystatus_level 2>/dev/null || echo na)"
            pid="$(ps -axo pid=,comm= | awk '$2 ~ /(^|\/)ipsw$/ {print $1; exit}')"
            rss_mb=0
            fd_count=0
            footprint=none
            if [ -n "$pid" ]; then
              rss_mb="$(ps -o rss= -p "$pid" | awk '{print int($1 / 1024)}')"
              footprint="$(top -l 1 -pid "$pid" -stats mem,cmprs 2>/dev/null | tail -1 | awk '{print $1 "/" $2}')"
              lsof -n -P -a -p "$pid" -d 0-999999 -Fn 2>/dev/null | sed -n 's/^n//p' >"$probe/fds.tmp"
              fd_count="$(wc -l <"$probe/fds.tmp" | tr -d ' ')"
              if [ "$fd_count" -gt 100 ]; then
                {
                  echo "$stamp fd_count=$fd_count"
                  sed -E 's/[0-9]+/N/g' "$probe/fds.tmp" | cut -d/ -f1-10 | sort | uniq -c | sort -rn | head -12
                } >>"$probe/fds.log"
              fi
            fi
            printf '%s free_gb=%s ipsw_rss_mb=%s footprint=%s fd_count=%s swap_used=%s mem_free_pct=%s\n' \
              "$stamp" "$free_gb" "${rss_mb:-0}" "${footprint:-none}" "$fd_count" "$swap_used" "$mem_free_pct"
            # The last run's runner died with no logs, so stop ipsw with a
            # goroutine dump before memory runs out, while uploads still work.
            if [ -n "$pid" ] && [ "$mem_free_pct" -le 5 ] 2>/dev/null; then
              low_samples=$((low_samples + 1))
            else
              low_samples=0
            fi
            if [ "$low_samples" -ge 3 ] && [ ! -e "$probe/watchdog.txt" ]; then
              echo "$stamp sent SIGQUIT to ipsw pid $pid after 3 samples with mem_free_pct<=5" |
                tee "$probe/watchdog.txt"
              kill -QUIT "$pid"
            fi
            sleep 20
          done
          EOF
          nohup bash "$RUNNER_TEMP/probe/sample.sh" "$RUNNER_TEMP/probe" >"$RUNNER_TEMP/probe/samples.log" 2>&1 &

      - name: Install the exact ipsw release with the job token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${IPSW_TAG#v}"
          asset="ipsw_${version}_macOS_arm64.tar.gz"
          digest="$(gh api "repos/blacktop/ipsw/releases/tags/$IPSW_TAG" \
            --jq ".assets[] | select(.name == \"$asset\") | .digest")"
          install_dir="$RUNNER_TEMP/ipsw-install"
          mkdir -p "$install_dir"
          archive="$install_dir/$asset"
          for attempt in 1 2 3 4 5; do
            if gh release download "$IPSW_TAG" --repo blacktop/ipsw \
              --pattern "$asset" --output "$archive" --clobber; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              exit 1
            fi
            sleep 5
          done
          printf '%s  %s\n' "${digest#sha256:}" "$archive" | shasum --algorithm 256 --check --strict
          tar -xzf "$archive" -C "$install_dir" ipsw
          "$install_dir/ipsw" version | tee "$RUNNER_TEMP/probe/ipsw-version.txt"
          grep -q "Version: $version," "$RUNNER_TEMP/probe/ipsw-version.txt"
          printf '%s\n' "$install_dir" >>"$GITHUB_PATH"

      - name: Fetch symbolicator signatures
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/symbolicator"
          git init --quiet "$repo"
          git -C "$repo" remote add origin https://github.com/blacktop/symbolicator.git
          git -C "$repo" fetch --quiet --depth 1 origin "$SYMBOLICATOR_COMMIT"
          git -C "$repo" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$repo" rev-parse HEAD)" = "$SYMBOLICATOR_COMMIT"

      - name: Download and verify exact inputs
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/ipsw-config"
          mkdir -p "$config"
          touch "$config/config.yaml"
          ipsw --config "$config/config.yaml" dl appledb \
            --os "$APPLEDB_OS" --device "$DEVICE" --version "$MAJOR." \
            --type "$KIND" --json --no-color >"$RUNNER_TEMP/sources.json"

          fetch() {
            local side="$1" build="$2" artifact url size sha256 file
            artifact="$(jq --exit-status --compact-output --arg build "$build" '
              [.releases[] | select(.build == $build) | .artifacts[] | select(.delivery == "full")]
              | select(length == 1) | .[0]' "$RUNNER_TEMP/sources.json")"
            url="$(jq --exit-status --raw-output .active_url <<<"$artifact")"
            size="$(jq --exit-status --raw-output .size <<<"$artifact")"
            sha256="$(jq --exit-status --raw-output .sha256 <<<"$artifact")"
            mkdir -p "$RUNNER_TEMP/$side"
            file="$RUNNER_TEMP/$side/${DEVICE}_${build}_${KIND}.${url##*.}"
            curl --fail --location --silent --show-error \
              --retry 5 --retry-delay 5 --retry-all-errors --output "$file" "$url"
            test "$(stat -f '%z' "$file")" = "$size"
            printf '%s  %s\n' "$sha256" "$file" | shasum --algorithm 256 --check --strict
            printf '%s_FILE=%s\n' "$side" "$file" >>"$GITHUB_ENV"
          }

          fetch OLD "$OLD_BUILD"
          fetch NEW "$NEW_BUILD"
          df -h / | tee -a "$RUNNER_TEMP/probe/runner.txt"

      - name: List and extract the reported payload names
        if: matrix.mode == 'names'
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/probe"
          pattern='^(bin/test|bin/\[|sbin/sha1|sbin/sha1sum|sbin/md5|usr/bin/(at|atq|atrm|batch|b64encode|uuencode|b64decode|uudecode|chsh|chfn|chpass|parldyn5\.34))$'
          printf '%s\n' "$pattern" >"$probe/names-pattern.txt"
          for side in OLD NEW; do
            file_var="${side}_FILE"
            ota="${!file_var}"
            ipsw --config "$RUNNER_TEMP/ipsw-config/config.yaml" ota ls \
              --payload --json --pattern "$pattern" "$ota" >"$probe/ls-$side.json"
            out="$RUNNER_TEMP/extract-$side"
            mkdir -p "$out"
            ipsw --config "$RUNNER_TEMP/ipsw-config/config.yaml" ota extract \
              --pattern "$pattern" --confirm --output "$out" "$ota" 2>&1 |
              tail -40 >"$probe/extract-$side.log"
            (cd "$out" && find . -type f -exec ls -li {} + | sort -k10) >"$probe/extract-$side.txt"
            echo "== $side"
            cat "$probe/extract-$side.txt"
          done

      - name: Run ipsw diff with the live generate.yml flags
        if: matrix.mode == 'diff'
        env:
          GOMEMLIMIT: ${{ matrix.gomemlimit }}
        run: |
          set +e
          set -uo pipefail
          probe="$RUNNER_TEMP/probe"
          args=(
            --title "$OLD_BUILD .vs $NEW_BUILD"
            --output "$RUNNER_TEMP/report"
            --markdown
            --fw
            --launchd
            --feat
            --strs
            --ent
            --files
            --starts
            --signatures "$RUNNER_TEMP/symbolicator/kernel"
            --block-list '__TEXT.__info_plist'
            --block-list '__AUTH_CONST.__auth_ptr'
          )
          if [ -n "$DIFF_DEVICE" ]; then
            args+=(--device "$DIFF_DEVICE")
          fi
          start=$SECONDS
          ipsw --config "$RUNNER_TEMP/ipsw-config/config.yaml" diff "${args[@]}" \
            "$OLD_FILE" "$NEW_FILE" 2>&1 |
            perl -MPOSIX -ne 'BEGIN { $| = 1 } if (/Extracting from .payload/) { print strftime("%T ", gmtime), "extracted $n payload files\n" if ++$n % 50000 == 0; next } print strftime("%T ", gmtime), $_' |
            tee "$probe/diff.log"
          status=${PIPESTATUS[0]}
          echo "diff_exit=$status seconds=$((SECONDS - start))" | tee "$probe/result.txt"
          exit "$status"

      - name: Capture memory kill reason
        if: failure()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set +e
          sudo log show --last 30m --style compact \
            --predicate 'eventMessage CONTAINS "memorystatus" OR eventMessage CONTAINS "jetsam"' |
            tail -200 >"$RUNNER_TEMP/probe/memory-kill.txt"
          exit 0

      - name: Summarize and package results
        if: always()
        run: |
          set +e
          set -uo pipefail
          probe="$RUNNER_TEMP/probe"
          report="$RUNNER_TEMP/report"
          if [ -d "$report" ]; then
            tar -czf "$probe/report.tgz" -C "$report" .
          fi
          rm -f "$probe/fds.tmp"
          readme="$(find "$report" -maxdepth 2 -name README.md 2>/dev/null | head -1)"
          status_file="$(find "$report" -maxdepth 2 -name status.json 2>/dev/null | head -1)"
          {
            echo "### $KIND $OLD_BUILD to $NEW_BUILD"
            echo '```'
            cat "$probe/result.txt" 2>/dev/null
            cat "$probe/ipsw-version.txt" 2>/dev/null
            cat "$probe/runner.txt" 2>/dev/null
            echo "min_free_gb=$(sed -n 's/.*free_gb=\([0-9]*\).*/\1/p' "$probe/samples.log" | sort -n | head -1)"
            echo "peak_ipsw_rss_mb=$(sed -n 's/.*ipsw_rss_mb=\([0-9]*\).*/\1/p' "$probe/samples.log" | sort -n | tail -1)"
            echo "peak_fd_count=$(sed -n 's/.*fd_count=\([0-9]*\).*/\1/p' "$probe/samples.log" | sort -n | tail -1)"
            echo "min_mem_free_pct=$(sed -n 's/.*mem_free_pct=\([0-9]*\).*/\1/p' "$probe/samples.log" | sort -n | head -1)"
            cat "$probe/watchdog.txt" 2>/dev/null
            echo "last_sample=$(tail -1 "$probe/samples.log")"
            if [ -n "$status_file" ]; then
              echo "status.json: $(jq --compact-output . "$status_file")"
            else
              echo 'no status.json produced'
            fi
            if [ -n "$readme" ]; then
              echo "report_files=$(find "$report" -type f | wc -l) report_size=$(du -sh "$report" | cut -f1)"
              echo "macho_links=$(grep -cE '^ *- \[[^]]*\]\(MACHOS/' "$readme") with_leading_slash=$(grep -cE '^ *- \[/[^]]*\]\(MACHOS/' "$readme")"
              grep -E '^## ' "$readme"
            else
              echo 'no README produced'
            fi
            echo 'logged errors:'
            grep -E '⨯|failed to' "$probe/diff.log" | cut -c1-200 | head -40
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-${{ matrix.label }}
          path: ${{ runner.temp }}/probe/
          retention-days: 14
          if-no-files-found: warn
